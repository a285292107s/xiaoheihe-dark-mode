<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafbfc" id="meta-theme" />
  <title>小黑盒深色模式 · 效果预览</title>
  <style data-hb-own>
    /* 预览壳自身样式：data-hb-own 让引擎在遍历 document.styleSheets 时整块跳过它，
       否则预览条的深色配色会被当成站点内容再映射一遍。 */
    html, body { margin: 0; padding: 0; }
    #hb-bar {
      position: fixed;
      left: 0; right: 0; top: 0;
      z-index: 2147483600;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font: 12px/1.4 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: rgba(20, 24, 29, 0.94);
      color: #f0f2f5;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }
    #hb-bar strong { font-weight: 700; margin-right: 6px; }
    #hb-bar button {
      font: inherit;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    #hb-bar button.on { background: #f0f2f5; color: #14191e; border-color: transparent; font-weight: 600; }
    #hb-bar .spacer { flex: 1; }
    #hb-bar .hint { opacity: 0.7; }
    #hb-stage { padding-top: 44px; }
    #hb-stage.is-dark { background: #0f1216; }
  </style>
</head>
<body>
  <div id="hb-bar" data-hb-own>
    <strong>小黑盒深色模式</strong>
    <button data-page="home" class="on">首页</button>
    <button data-page="detail">帖子详情</button>
    <span class="spacer"></span>
    <span class="hint">真实页面 DOM 快照 · 深色由油猴脚本驱动</span>
    <button id="hb-theme">深色</button>
  </div>
  <div id="hb-stage"></div>

  <script type="module">
    const stage = document.getElementById('hb-stage');
    const themeBtn = document.getElementById('hb-theme');
    const metaTheme = document.getElementById('meta-theme');
    const STORAGE_KEY = 'heybox-dark-mode';

    const loaded = {
      styleNodes: [],
    };

    function clearSiteStyles() {
      for (const n of loaded.styleNodes) n.remove();
      loaded.styleNodes = [];
    }

    function adoptStyles(doc) {
      clearSiteStyles();
      const nodes = [
        ...doc.querySelectorAll('link[rel="stylesheet"]'),
        ...doc.querySelectorAll('style'),
      ];
      for (const node of nodes) {
        const clone = node.cloneNode(true);
        document.head.appendChild(clone);
        loaded.styleNodes.push(clone);
      }
    }

    async function loadPage(name) {
      const res = await fetch(`fixtures/${name}.html`);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      adoptStyles(doc);
      stage.innerHTML = doc.body.innerHTML;
      // 换页只换 DOM，不换站点 CSS：引擎改的是规则而不是元素，
      // 新增节点里的内联颜色由内联观察器处理，这里不需要做任何事。
    }

    // 深色状态由脚本持有；脚本没加载时退回预览壳自己的类名与存储
    const ROOT_CLASS = 'hb-dark';
    const hasEngine = () => typeof window.__hbSetDark === 'function';
    const isDarkNow = () =>
      typeof window.__hbIsDark === 'function'
        ? window.__hbIsDark()
        : document.documentElement.classList.contains(ROOT_CLASS);

    function setTheme(dark) {
      if (hasEngine()) {
        window.__hbSetDark(dark);
      } else {
        const root = document.documentElement;
        root.classList.toggle(ROOT_CLASS, dark);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        try { localStorage.setItem(STORAGE_KEY, dark ? '1' : '0'); } catch (_) {}
      }
      const on = isDarkNow();
      stage.classList.toggle('is-dark', on);
      themeBtn.textContent = on ? '浅色' : '深色';
      metaTheme.setAttribute('content', on ? '#0f1216' : '#fafbfc');
    }

    themeBtn.addEventListener('click', () => setTheme(!isDarkNow()));

    let current = 'home';
    for (const btn of document.querySelectorAll('#hb-bar [data-page]')) {
      btn.addEventListener('click', async () => {
        current = btn.dataset.page;
        document
          .querySelectorAll('#hb-bar [data-page]')
          .forEach((b) => b.classList.toggle('on', b === btn));
        await loadPage(current);
      });
    }

    // 深色已经由脚本在 document-start 应用过了，这里只把预览条同步到当前状态
    let startDark = false;
    try {
      startDark = typeof window.__hbIsDark === 'function'
        ? window.__hbIsDark()
        : (() => {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved === '1' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches);
          })();
    } catch (_) {}

    await loadPage(current);
    setTheme(startDark);
  </script>

  <!-- 油猴脚本本体（与装到浏览器里的是同一个产物） -->
  <script src="dist/xiaoheihe-dark-mode.user.js"></script>
</body>
</html>
