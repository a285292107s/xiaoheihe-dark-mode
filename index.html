<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>小黑盒深色模式 · 效果预览</title>
  <style data-hb-own>
    html, body { margin: 0; padding: 0; }
    html { --bar-h: 44px; }
    #hb-bar {
      --bar-line: var(--hbd-shell-line);
      --bar-ink: var(--hbd-shell-ink);
      --bar-ink-strong: var(--hbd-shell-ink-strong);
      --bar-accent: var(--hbd-shell-accent);
      --bar-accent-wash: var(--hbd-shell-accent-wash);
      position: fixed;
      left: 0; right: 0; top: 0;
      z-index: 2147483600;
      box-sizing: border-box;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 16px;
      font: 12px/1 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      white-space: nowrap;
      background: var(--hbd-shell-surface);
      color: var(--bar-ink-strong);
      backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid var(--bar-line);
      box-shadow: var(--hbd-shell-edge);
    }
    #hb-bar .mark {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      margin-right: 8px;
      border-radius: 3px;
      background: var(--bar-accent);
    }
    #hb-bar .brand {
      flex: 0 0 auto;
      font-weight: 600;
      letter-spacing: 0;
      margin-right: 12px;
    }
    #hb-bar .brand-short { display: none; }
    #hb-bar button {
      flex: 0 0 auto;
      font: inherit;
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--bar-ink);
      cursor: pointer;
      transition: background-color var(--hbd-t-hover) var(--hbd-ease), color var(--hbd-t-hover) var(--hbd-ease);
    }
    #hb-bar button:hover { background: var(--hbd-shell-hover); color: var(--bar-ink-strong); }
    #hb-bar button:active { background: var(--hbd-shell-active); }
    #hb-bar button.on {
      background: var(--bar-accent-wash);
      color: var(--bar-ink-strong);
      box-shadow: inset 0 0 0 1px var(--hbd-shell-accent-line);
      font-weight: 600;
    }
    #hb-bar button.on:hover { background: var(--hbd-shell-accent-wash-strong); }
    #hb-bar button:focus-visible { outline: 2px solid var(--hbd-shell-focus); outline-offset: 2px; }
    #hb-bar .rule {
      flex: 0 0 auto;
      width: 1px;
      height: 16px;
      margin: 0 8px;
      background: var(--bar-line);
    }
    #hb-bar .spacer { flex: 1; }
    #hb-bar .hint { color: var(--hbd-shell-ink-soft); font-size: 11px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 767px) {
      html { --bar-h: 52px; }
      #hb-bar { padding: 0 12px; }
      #hb-bar .brand-long,
      #hb-bar .hint,
      #hb-bar .rule { display: none; }
      #hb-bar .brand-short { display: inline; }
      #hb-bar button { height: 44px; min-width: 44px; padding: 0 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #hb-bar button { transition: none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      #hb-bar { background: var(--hbd-shell-surface-solid); backdrop-filter: none; }
    }
    @media (forced-colors: active) {
      #hb-bar { background: Canvas; color: CanvasText; border-bottom-color: ButtonText; box-shadow: none; backdrop-filter: none; }
      #hb-bar .mark { background: Highlight; }
      #hb-bar button { color: ButtonText; }
      #hb-bar button.on { background: Canvas; color: Highlight; box-shadow: inset 0 0 0 1px Highlight; }
      #hb-bar .hint { color: CanvasText; }
    }
    #hb-stage { padding-top: var(--bar-h); }
    #hb-stage.is-dark { background: var(--hbd-canvas); }
  </style>
</head>
<body>
  <div id="hb-bar" data-hb-own>
    <span class="mark" aria-hidden="true"></span>
    <strong class="brand"
      ><span class="brand-long">小黑盒深色模式</span><span class="brand-short">小黑盒</span></strong
    >
    <button data-page="home" class="on" aria-pressed="true">首页</button>
    <button data-page="detail" aria-pressed="false">帖子详情</button>
    <span class="spacer"></span>
    <span class="hint">真实页面 DOM 快照 · 深色与精简由油猴脚本驱动</span>
    <span class="rule"></span>
    <button id="hb-theme">深色</button>
  </div>
  <div id="hb-stage"></div>

  <script type="module">
    const stage = document.getElementById('hb-stage');
    const themeBtn = document.getElementById('hb-theme');
    const metaTheme = document.createElement('meta');
    metaTheme.name = 'theme-color';
    document.head.appendChild(metaTheme);
    const STORAGE_KEY = 'heybox-dark-mode';

    const loaded = {
      styleNodes: [],
    };

    function clearSiteStyles() {
      for (const n of loaded.styleNodes) n.remove();
      loaded.styleNodes = [];
    }

    function adoptStyles(doc) {
      clearSiteStyles();
      const nodes = [
        ...doc.querySelectorAll('link[rel="stylesheet"]'),
        ...doc.querySelectorAll('style'),
      ];
      for (const node of nodes) {
        const clone = node.cloneNode(true);
        document.head.appendChild(clone);
        loaded.styleNodes.push(clone);
      }
    }

    async function loadPage(name) {
      const res = await fetch(`fixtures/${name}.html`);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      adoptStyles(doc);
      stage.innerHTML = doc.body.innerHTML;
    }

    const ROOT_CLASS = 'hb-dark';
    const hasEngine = () => typeof window.__hbSetDark === 'function';
    const isDarkNow = () =>
      typeof window.__hbIsDark === 'function'
        ? window.__hbIsDark()
        : document.documentElement.classList.contains(ROOT_CLASS);

    function setTheme(dark) {
      if (hasEngine()) {
        window.__hbSetDark(dark);
      } else {
        const root = document.documentElement;
        root.classList.toggle(ROOT_CLASS, dark);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        try { localStorage.setItem(STORAGE_KEY, dark ? '1' : '0'); } catch (_) {}
      }
      const on = isDarkNow();
      stage.classList.toggle('is-dark', on);
      themeBtn.textContent = on ? '浅色' : '深色';
      const canvas = getComputedStyle(document.documentElement).getPropertyValue('--hbd-shell-canvas').trim();
      if (canvas) metaTheme.setAttribute('content', canvas);
    }

    themeBtn.addEventListener('click', () => setTheme(!isDarkNow()));

    let current = 'home';
    for (const btn of document.querySelectorAll('#hb-bar [data-page]')) {
      btn.addEventListener('click', async () => {
        current = btn.dataset.page;
        document.querySelectorAll('#hb-bar [data-page]').forEach((b) => {
          const on = b === btn;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        await loadPage(current);
      });
    }

    let startDark = false;
    try {
      startDark = typeof window.__hbIsDark === 'function'
        ? window.__hbIsDark()
        : (() => {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved === '1' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches);
          })();
    } catch (_) {}

    await loadPage(current);
    setTheme(startDark);
  </script>

  <script src="dist/xiaoheihe-dark-mode.user.js"></script>
</body>
</html>
