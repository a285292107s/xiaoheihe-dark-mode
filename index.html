<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fafbfc" id="meta-theme" />
  <title>小黑盒深色模式 · 效果预览</title>
  <style data-hb-own>
    html, body { margin: 0; padding: 0; }
    #hb-bar {
      position: fixed;
      left: 0; right: 0; top: 0;
      z-index: 2147483600;
      box-sizing: border-box;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      font: 12px/1 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: rgba(20, 24, 29, 0.94);
      color: #f0f2f5;
      backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #hb-bar .brand {
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-right: 10px;
    }
    #hb-bar button {
      font: inherit;
      padding: 6px 11px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(240, 242, 245, 0.72);
      cursor: pointer;
      transition: background-color 160ms cubic-bezier(0.2, 0, 0, 1), color 160ms cubic-bezier(0.2, 0, 0, 1);
    }
    #hb-bar button:hover { background: rgba(255, 255, 255, 0.07); color: #f0f2f5; }
    #hb-bar button:active { background: rgba(255, 255, 255, 0.12); }
    #hb-bar button.on {
      background: #eef1f5;
      color: #14191e;
      border-color: transparent;
      font-weight: 600;
    }
    #hb-bar button.on:hover { background: #ffffff; }
    #hb-bar button.on:active { background: #dde2e9; }
    #hb-bar button:focus-visible { outline: 2px solid rgba(244, 247, 250, 0.9); outline-offset: 2px; }
    #hb-bar .rule {
      width: 1px;
      height: 16px;
      margin: 0 8px;
      background: rgba(255, 255, 255, 0.12);
    }
    #hb-bar .spacer { flex: 1; }
    #hb-bar .hint { color: rgba(240, 242, 245, 0.62); letter-spacing: 0.01em; }
    @media (prefers-reduced-motion: reduce) {
      #hb-bar button { transition: none; }
    }
    #hb-stage { padding-top: 48px; }
    #hb-stage.is-dark { background: #0e1116; }
  </style>
</head>
<body>
  <div id="hb-bar" data-hb-own>
    <strong class="brand">小黑盒深色模式</strong>
    <button data-page="home" class="on" aria-pressed="true">首页</button>
    <button data-page="detail" aria-pressed="false">帖子详情</button>
    <span class="spacer"></span>
    <span class="hint">真实页面 DOM 快照 · 深色与精简由油猴脚本驱动</span>
    <span class="rule"></span>
    <button id="hb-theme">深色</button>
  </div>
  <div id="hb-stage"></div>

  <script type="module">
    const stage = document.getElementById('hb-stage');
    const themeBtn = document.getElementById('hb-theme');
    const metaTheme = document.getElementById('meta-theme');
    const STORAGE_KEY = 'heybox-dark-mode';

    const loaded = {
      styleNodes: [],
    };

    function clearSiteStyles() {
      for (const n of loaded.styleNodes) n.remove();
      loaded.styleNodes = [];
    }

    function adoptStyles(doc) {
      clearSiteStyles();
      const nodes = [
        ...doc.querySelectorAll('link[rel="stylesheet"]'),
        ...doc.querySelectorAll('style'),
      ];
      for (const node of nodes) {
        const clone = node.cloneNode(true);
        document.head.appendChild(clone);
        loaded.styleNodes.push(clone);
      }
    }

    async function loadPage(name) {
      const res = await fetch(`fixtures/${name}.html`);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      adoptStyles(doc);
      stage.innerHTML = doc.body.innerHTML;
    }

    const ROOT_CLASS = 'hb-dark';
    const hasEngine = () => typeof window.__hbSetDark === 'function';
    const isDarkNow = () =>
      typeof window.__hbIsDark === 'function'
        ? window.__hbIsDark()
        : document.documentElement.classList.contains(ROOT_CLASS);

    function setTheme(dark) {
      if (hasEngine()) {
        window.__hbSetDark(dark);
      } else {
        const root = document.documentElement;
        root.classList.toggle(ROOT_CLASS, dark);
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        try { localStorage.setItem(STORAGE_KEY, dark ? '1' : '0'); } catch (_) {}
      }
      const on = isDarkNow();
      stage.classList.toggle('is-dark', on);
      themeBtn.textContent = on ? '浅色' : '深色';
      metaTheme.setAttribute('content', on ? '#0e1116' : '#fafbfc');
    }

    themeBtn.addEventListener('click', () => setTheme(!isDarkNow()));

    let current = 'home';
    for (const btn of document.querySelectorAll('#hb-bar [data-page]')) {
      btn.addEventListener('click', async () => {
        current = btn.dataset.page;
        document.querySelectorAll('#hb-bar [data-page]').forEach((b) => {
          const on = b === btn;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        await loadPage(current);
      });
    }

    let startDark = false;
    try {
      startDark = typeof window.__hbIsDark === 'function'
        ? window.__hbIsDark()
        : (() => {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved === '1' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches);
          })();
    } catch (_) {}

    await loadPage(current);
    setTheme(startDark);
  </script>

  <script src="dist/xiaoheihe-dark-mode.user.js"></script>
</body>
</html>
